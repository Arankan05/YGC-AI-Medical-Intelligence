services:
  - type: web
    name: ygc-ai-medical-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
